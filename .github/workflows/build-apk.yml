name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate release keystore
        run: keytool -genkeypair -v -keystore app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias pulseping -storepass pulseping123 -keypass pulseping123 -dname "CN=PulsePing LK, OU=Mobile, O=PulsePing, L=Colombo, S=Western, C=LK"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: PulsePing-LK-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
