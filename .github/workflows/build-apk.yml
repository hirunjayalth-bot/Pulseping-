name: Build Android APK and AAB

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate release keystore
        run: rm -f app/release.jks && keytool -genkeypair -v -keystore app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias pulseping -storepass pulseping123 -keypass pulseping123 -dname "CN=PulsePing,O=PulsePing,C=LK"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK and bundle
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: PulsePing-Release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
